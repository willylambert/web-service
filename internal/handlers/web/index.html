<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#071018" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Ouiligo — Horaires</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>
  <main class="board">
    <header class="board__header">
      <h1 class="board__station">Ouiligo</h1>
      <p class="board__subtitle">A nous de vous faire préférer la marche à pied</p>
      <div class="board__controls" role="tablist" aria-label="Sens">
        <button class="tab is-active" role="tab" aria-selected="true" data-direction="departures">Aller à Angers</button>
        <button class="tab" role="tab" aria-selected="false" data-direction="arrivals">Retour à St Mathurin</button>
      </div>
    </header>

    <section class="board__panel" aria-live="polite">
      <div class="board__meta">
        <span id="clock">--:--</span>
        <span id="updated">Mise à jour…</span>
      </div>
      <div id="status" class="status" hidden></div>
      <ul id="rows" class="train-list"></ul>
    </section>

    <footer class="board__footer">
      <span>Données SNCF Open Data</span>
      <button type="button" id="refresh" class="refresh">Actualiser</button>
    </footer>
  </main>
  <script src="/assets/app.js" type="module"></script>
</body>
</html>
